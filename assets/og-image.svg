<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0B0E13"/>
            <stop offset="100%" stop-color="#1B2230"/>
        </linearGradient>
        <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
            <stop offset="0%" stop-color="#FF6B35" stop-opacity=".4"/>
            <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
            <stop offset="0%" stop-color="#1B85B8" stop-opacity=".35"/>
            <stop offset="100%" stop-color="#1B85B8" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#FF6B35"/>
            <stop offset="50%" stop-color="#FFD23F"/>
            <stop offset="100%" stop-color="#D7263D"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="630" fill="url(#bg)"/>
    <rect width="1200" height="630" fill="url(#glow1)"/>
    <rect width="1200" height="630" fill="url(#glow2)"/>

    <!-- Logo -->
    <g transform="translate(80, 80)">
        <polygon points="0,90 30,30 60,90" fill="#FF6B35"/>
        <polygon points="30,90 70,10 110,90" fill="#FFD23F"/>
        <polygon points="70,90 95,40 120,90" fill="#06A77D"/>
        <polygon points="20,90 40,55 60,90" fill="#1B85B8"/>
        <polygon points="60,90 85,60 110,90" fill="#D7263D"/>
    </g>

    <!-- Brand text -->
    <text x="80" y="280" font-family="Bebas Neue, Impact, sans-serif" font-size="120" letter-spacing="6" fill="#F4F6FA" font-weight="700">GRIP</text>
    <text x="80" y="320" font-family="Montserrat, sans-serif" font-size="22" letter-spacing="10" fill="#9AA3B5">CLIMBING CLUB</text>

    <!-- Tagline -->
    <text x="80" y="430" font-family="Bebas Neue, Impact, sans-serif" font-size="76" letter-spacing="2" fill="#F4F6FA">ESCALA. ENTRENA.</text>
    <text x="80" y="500" font-family="Bebas Neue, Impact, sans-serif" font-size="76" letter-spacing="2" fill="url(#grad)">CONQUISTA.</text>

    <!-- Location -->
    <text x="80" y="560" font-family="Montserrat, sans-serif" font-size="20" letter-spacing="4" fill="#9AA3B5" font-weight="500">CALARCÁ · QUINDÍO · EJE CAFETERO</text>

    <!-- Decorative holds -->
    <ellipse cx="950" cy="180" rx="36" ry="28" fill="#FF6B35" transform="rotate(15 950 180)"/>
    <ellipse cx="1050" cy="290" rx="32" ry="24" fill="#FFD23F" transform="rotate(-10 1050 290)"/>
    <ellipse cx="900" cy="380" rx="36" ry="28" fill="#1B85B8" transform="rotate(20 900 380)"/>
    <ellipse cx="1050" cy="470" rx="32" ry="26" fill="#06A77D" transform="rotate(-5 1050 470)"/>
    <ellipse cx="970" cy="560" rx="34" ry="26" fill="#D7263D" transform="rotate(8 970 560)"/>
</svg>
